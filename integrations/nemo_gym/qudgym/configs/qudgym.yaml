# Source-reviewed integration recipe, NOT a claim of a successful NeMo rollout.
qudgym_resources_server:
  resources_servers:
    qudgym:
      entrypoint: app.py
      domain: games
      verified: false
      description: Mock QudGym decision-boundary environment; no live Qud yet
qudgym_agent:
  responses_api_agents:
    gymnasium_agent:
      entrypoint: app.py
      max_steps: 128
      resources_server:
        type: resources_servers
        name: qudgym_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/qudgym/data/example.jsonl
